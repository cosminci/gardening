name: publish

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-ghcr
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish GHCR image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require main
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Publish must be dispatched from main" >&2
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Dagger
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.9 sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Verify and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          npm ci --prefix .dagger --no-audit --no-fund
          dagger develop
          npm --prefix .dagger run verify
          dagger call verify --all
          tag=$(dagger call release-version)
          registry_token=$(curl -fsS -u "$GITHUB_ACTOR:$GITHUB_TOKEN" -G \
            --data-urlencode 'scope=repository:cosminci/plant-journal:pull' \
            --data-urlencode 'service=ghcr.io' https://ghcr.io/token | jq -er '.token | select(length > 0)')
          status=$(curl -sS -o /dev/null -w '%{http_code}' -I \
            -H "Authorization: Bearer $registry_token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/cosminci/plant-journal/manifests/$tag")
          case "$status" in
            404) ;;
            200) echo "Version $tag is already published" >&2; exit 1 ;;
            *) echo "GHCR lookup failed: HTTP $status" >&2; exit 1 ;;
          esac
          dagger call publish --tag="$tag" --token=env:GITHUB_TOKEN --registry-user="$GITHUB_ACTOR"
