name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: publish-ghcr
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GHCR image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Dagger
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.9 sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Restore annotated release tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          credential=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $credential" \
            git fetch --force --no-tags origin \
              "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag

      - name: Prepare pipeline
        run: |
          npm ci --prefix .dagger --no-audit --no-fund
          dagger develop

      - name: Verify and publish annotated release tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/release.sh "$GITHUB_REF_NAME"
