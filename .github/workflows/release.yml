name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: publish-ghcr
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GHCR image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install Dagger
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.9 sh
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Prepare pipeline
        run: |
          npm ci --prefix .dagger --no-audit --no-fund
          dagger develop

      - name: Verify and publish annotated release tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/release.sh "$GITHUB_REF_NAME"
