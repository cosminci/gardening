openapi: 3.1.0
info:
  title: Gardening API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Liveness probe
      operationId: getHealth
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /attention:
    get:
      summary: Read plant attention
      operationId: getAttention
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttentionProjection'
  /plants/{plantId}/operations:
    get:
      summary: List a bounded page of plant operations
      operationId: getPlantsPlantidOperations
      parameters:
      - name: plantId
        in: path
        required: true
        schema:
          type: string
      - name: offset
        in: query
        required: false
        schema:
          default: 0
          type: integer
          format: int32
          minimum: 0
      - name: pageSize
        in: query
        required: false
        schema:
          default: 3
          type: integer
          format: int32
          minimum: 1
          maximum: 10
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationPage'
        '400':
          description: 'Invalid value for: query parameter offset, Invalid value for:
            query parameter pageSize'
          content:
            text/plain:
              schema:
                type: string
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      summary: Log a plant operation
      operationId: postPlantsPlantidOperations
      parameters:
      - name: plantId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationDetails'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOperation'
        '400':
          description: 'Invalid value for: body'
          content:
            text/plain:
              schema:
                type: string
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /operations/{operationId}:
    put:
      summary: Edit a plant operation
      operationId: putOperationsOperationid
      parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationDetails'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          description: 'Invalid value for: body'
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /substrate-components:
    get:
      summary: List substrate components
      operationId: getSubstrate-components
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubstrateComponent'
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      summary: Add a substrate component
      operationId: postSubstrate-components
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubstrateComponentData'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubstrateComponent'
        '400':
          description: 'Invalid value for: body'
          content:
            text/plain:
              schema:
                type: string
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /substrate-components/{componentId}:
    put:
      summary: Edit a substrate component
      operationId: putSubstrate-componentsComponentid
      parameters:
      - name: componentId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubstrateComponentData'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubstrateComponent'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /pesticides:
    get:
      summary: List pesticides
      operationId: getPesticides
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pesticide'
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      summary: Add a pesticide
      operationId: postPesticides
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PesticideData'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pesticide'
        '400':
          description: 'Invalid value for: body'
          content:
            text/plain:
              schema:
                type: string
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /pesticides/{pesticideId}:
    put:
      summary: Edit a pesticide
      operationId: putPesticidesPesticideid
      parameters:
      - name: pesticideId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PesticideData'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pesticide'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ActionType:
      title: ActionType
      type: string
      enum:
      - fertilized
      - noAction
      - pesticide
      - pruned
      - watered
    ApiError:
      title: ApiError
      type: object
      required:
      - message
      properties:
        message:
          type: string
    AttentionProjection:
      title: AttentionProjection
      type: object
      required:
      - measuredAt
      - plants
      properties:
        measuredAt:
          type: string
          format: date-time
        plants:
          type: array
          items:
            $ref: '#/components/schemas/PlantAttention'
    Care:
      title: Care
      type: object
      required:
      - actions
      - pesticides
      - moisture
      - notes
      - kind
      properties:
        actions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ActionType'
        pesticides:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        moisture:
          $ref: '#/components/schemas/MoistureLevel'
        notes:
          type:
          - string
          - 'null'
        kind:
          type: string
          const: care
    Current:
      title: Current
      type: object
      required:
      - sampleCount
      - averageIntervalMillis
      - elapsedMillis
      - kind
      properties:
        sampleCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 20
        averageIntervalMillis:
          type: string
        elapsedMillis:
          type: string
        kind:
          type: string
          const: current
    HealthResponse:
      title: HealthResponse
      type: object
      required:
      - status
      - version
      properties:
        status:
          type: string
        version:
          type: string
    LoggedOperation:
      title: LoggedOperation
      type: object
      required:
      - id
      properties:
        id:
          type: string
    MoistureLevel:
      title: MoistureLevel
      type: string
      enum:
      - dry
      - moderateMinus
      - moderatePlus
      - noReading
      - wet
    Operation:
      title: Operation
      type: object
      required:
      - id
      - plantId
      - date
      - details
      properties:
        id:
          type: string
        plantId:
          type: string
        date:
          type: string
          format: date-time
        details:
          $ref: '#/components/schemas/OperationDetails'
    OperationDetails:
      title: OperationDetails
      oneOf:
      - $ref: '#/components/schemas/Care'
      - $ref: '#/components/schemas/Repot'
      discriminator:
        propertyName: kind
        mapping:
          care: '#/components/schemas/Care'
          repot: '#/components/schemas/Repot'
    OperationPage:
      title: OperationPage
      type: object
      required:
      - operations
      - hasNextPage
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
        hasNextPage:
          type: boolean
    Overdue:
      title: Overdue
      type: object
      required:
      - sampleCount
      - averageIntervalMillis
      - elapsedMillis
      - kind
      properties:
        sampleCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 20
        averageIntervalMillis:
          type: string
        elapsedMillis:
          type: string
        kind:
          type: string
          const: overdue
    Pesticide:
      title: Pesticide
      type: object
      required:
      - id
      - data
      properties:
        id:
          type: string
          format: uuid
        data:
          $ref: '#/components/schemas/PesticideData'
    PesticideData:
      title: PesticideData
      type: object
      required:
      - name
      - type
      - info
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/PesticideType'
        info:
          type:
          - string
          - 'null'
    PesticideType:
      title: PesticideType
      type: string
      enum:
      - fungicide
      - insecticide
      - treatment
    Plant:
      title: Plant
      type: object
      required:
      - id
      - details
      properties:
        id:
          type: string
        details:
          $ref: '#/components/schemas/PlantDetails'
    PlantAttention:
      title: PlantAttention
      type: object
      required:
      - plant
      - watering
      properties:
        plant:
          $ref: '#/components/schemas/Plant'
        watering:
          $ref: '#/components/schemas/WireWateringAttention'
    PlantDetails:
      title: PlantDetails
      type: object
      required:
      - species
      - nickname
      - location
      - substrate
      - status
      properties:
        species:
          type: string
        nickname:
          type:
          - string
          - 'null'
        location:
          type: string
        substrate:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SubstratePart'
        status:
          $ref: '#/components/schemas/PlantStatus'
    PlantStatus:
      title: PlantStatus
      type: string
      enum:
      - active
      - archived
    RedAlert:
      title: RedAlert
      type: object
      required:
      - sampleCount
      - averageIntervalMillis
      - elapsedMillis
      - kind
      properties:
        sampleCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 20
        averageIntervalMillis:
          type: string
        elapsedMillis:
          type: string
        kind:
          type: string
          const: redAlert
    Repot:
      title: Repot
      type: object
      required:
      - substrate
      - notes
      - kind
      properties:
        substrate:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SubstratePart'
        notes:
          type:
          - string
          - 'null'
        kind:
          type: string
          const: repot
    SubstrateComponent:
      title: SubstrateComponent
      type: object
      required:
      - id
      - data
      properties:
        id:
          type: string
          format: uuid
        data:
          $ref: '#/components/schemas/SubstrateComponentData'
    SubstrateComponentData:
      title: SubstrateComponentData
      type: object
      required:
      - name
      - info
      properties:
        name:
          type: string
        info:
          type:
          - string
          - 'null'
    SubstratePart:
      title: SubstratePart
      type: object
      required:
      - componentId
      - share
      properties:
        componentId:
          type: string
          format: uuid
        share:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
    Unavailable:
      title: Unavailable
      type: object
      required:
      - sampleCount
      - elapsedMillis
      - kind
      properties:
        sampleCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 20
        elapsedMillis:
          type:
          - string
          - 'null'
        kind:
          type: string
          const: unavailable
    WireWateringAttention:
      title: WireWateringAttention
      oneOf:
      - $ref: '#/components/schemas/Current'
      - $ref: '#/components/schemas/Overdue'
      - $ref: '#/components/schemas/RedAlert'
      - $ref: '#/components/schemas/Unavailable'
      discriminator:
        propertyName: kind
        mapping:
          current: '#/components/schemas/Current'
          overdue: '#/components/schemas/Overdue'
          redAlert: '#/components/schemas/RedAlert'
          unavailable: '#/components/schemas/Unavailable'
