openapi: 3.1.0
info:
  title: Gardening API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Liveness probe
      operationId: getHealth
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /plants:
    get:
      summary: List plants by status
      operationId: getPlants
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PlantStatus'
          default: active
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plant'
        '400':
          description: 'Invalid value for: query parameter status'
          content:
            text/plain:
              schema:
                type: string
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      summary: Create an active plant
      operationId: postPlants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantCreation'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
        '400':
          description: 'Invalid value for: body'
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /plants/archived/count:
    get:
      summary: Count archived plants
      operationId: getPlantsArchivedCount
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchivedPlantCount'
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /plants/{plantId}:
    patch:
      summary: Patch a plant
      operationId: patchPlantsPlantid
      parameters:
      - name: plantId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PlantPatchOperation'
        required: true
      responses:
        '204':
          description: ''
        '400':
          description: ''
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /attention:
    get:
      summary: Read plant attention
      operationId: getAttention
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttentionProjection'
  /operations:
    get:
      summary: List a bounded page of plant operations
      operationId: getOperations
      parameters:
      - name: plantId
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: offset
        in: query
        required: false
        schema:
          default: 0
          type: integer
          format: int32
          minimum: 0
      - name: pageSize
        in: query
        required: false
        schema:
          default: 3
          type: integer
          format: int32
          minimum: 1
          maximum: 10
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationPage'
        '400':
          description: 'Invalid value for: query parameter plantId, Invalid value
            for: query parameter offset, Invalid value for: query parameter pageSize'
          content:
            text/plain:
              schema:
                type: string
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      summary: Log a plant operation
      operationId: postOperations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogOperationRequest'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOperation'
        '400':
          description: 'Invalid value for: body'
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /operations/date-range:
    get:
      summary: Read the first and last recorded operation dates
      operationId: getOperationsDate-range
      parameters:
      - name: plantId
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationDateRange'
        '400':
          description: 'Invalid value for: query parameter plantId'
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /operations/{operationId}:
    put:
      summary: Edit a plant operation
      operationId: putOperationsOperationid
      parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationDetails'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          description: 'Invalid value for: body'
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      summary: Delete a plant operation
      operationId: deleteOperationsOperationid
      parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /pesticides:
    get:
      summary: List pesticides
      operationId: getPesticides
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pesticide'
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      summary: Add a pesticide
      operationId: postPesticides
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PesticideData'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pesticide'
        '400':
          description: 'Invalid value for: body'
          content:
            text/plain:
              schema:
                type: string
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /pesticides/{pesticideId}:
    put:
      summary: Edit a pesticide
      operationId: putPesticidesPesticideid
      parameters:
      - name: pesticideId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PesticideData'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pesticide'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /substrate/components:
    get:
      summary: List substrate components
      operationId: getSubstrateComponents
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubstrateComponent'
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      summary: Add a substrate component
      operationId: postSubstrateComponents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubstrateComponentData'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubstrateComponent'
        '400':
          description: 'Invalid value for: body'
          content:
            text/plain:
              schema:
                type: string
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /substrate/components/{componentId}:
    put:
      summary: Edit a substrate component
      operationId: putSubstrateComponentsComponentid
      parameters:
      - name: componentId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubstrateComponentData'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubstrateComponent'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ActionType:
      title: ActionType
      type: string
      enum:
      - fertilized
      - noAction
      - pesticide
      - pruned
      - watered
    ApiError:
      title: ApiError
      type: object
      required:
      - message
      properties:
        message:
          type: string
    ArchivedPlantCount:
      title: ArchivedPlantCount
      type: object
      required:
      - count
      properties:
        count:
          type: integer
          format: int64
    AttentionProjection:
      title: AttentionProjection
      type: object
      required:
      - measuredAt
      - plants
      properties:
        measuredAt:
          type: string
          format: date-time
        plants:
          type: array
          items:
            $ref: '#/components/schemas/PlantAttention'
    Care:
      title: Care
      type: object
      required:
      - actions
      - pesticides
      - moisture
      - notes
      - kind
      properties:
        actions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ActionType'
        pesticides:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        moisture:
          $ref: '#/components/schemas/MoistureLevel'
        notes:
          type:
          - string
          - 'null'
        kind:
          type: string
          const: care
    Empty:
      title: Empty
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
          const: empty
    HealthResponse:
      title: HealthResponse
      type: object
      required:
      - status
      - version
      properties:
        status:
          type: string
        version:
          type: string
    LogOperationRequest:
      title: LogOperationRequest
      type: object
      required:
      - plantId
      - date
      - details
      properties:
        plantId:
          type: string
          minLength: 1
        date:
          type: string
          format: date-time
        details:
          $ref: '#/components/schemas/OperationDetails'
    LoggedOperation:
      title: LoggedOperation
      type: object
      required:
      - id
      properties:
        id:
          type: string
    MoistureLevel:
      title: MoistureLevel
      type: string
      enum:
      - dry
      - moderateMinus
      - moderatePlus
      - noReading
      - wet
    Operation:
      title: Operation
      type: object
      required:
      - id
      - plantId
      - date
      - details
      properties:
        id:
          type: string
        plantId:
          type: string
        date:
          type: string
          format: date-time
        details:
          $ref: '#/components/schemas/OperationDetails'
    OperationDateRange:
      title: OperationDateRange
      oneOf:
      - $ref: '#/components/schemas/Empty'
      - $ref: '#/components/schemas/Recorded'
      discriminator:
        propertyName: kind
        mapping:
          empty: '#/components/schemas/Empty'
          recorded: '#/components/schemas/Recorded'
    OperationDetails:
      title: OperationDetails
      oneOf:
      - $ref: '#/components/schemas/Care'
      - $ref: '#/components/schemas/Repot'
      discriminator:
        propertyName: kind
        mapping:
          care: '#/components/schemas/Care'
          repot: '#/components/schemas/Repot'
    OperationPage:
      title: OperationPage
      type: object
      required:
      - operations
      - hasNextPage
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
        hasNextPage:
          type: boolean
    Pesticide:
      title: Pesticide
      type: object
      required:
      - id
      - data
      properties:
        id:
          type: string
          format: uuid
        data:
          $ref: '#/components/schemas/PesticideData'
    PesticideData:
      title: PesticideData
      type: object
      required:
      - name
      - type
      - info
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/PesticideType'
        info:
          type:
          - string
          - 'null'
    PesticideType:
      title: PesticideType
      type: string
      enum:
      - fungicide
      - insecticide
      - treatment
    Plant:
      title: Plant
      type: object
      required:
      - id
      - details
      properties:
        id:
          type: string
        details:
          $ref: '#/components/schemas/PlantDetails'
    PlantAttention:
      title: PlantAttention
      type: object
      required:
      - plantId
      - watering
      properties:
        plantId:
          type: string
        watering:
          $ref: '#/components/schemas/WateringAttention'
    PlantCreation:
      title: PlantCreation
      type: object
      required:
      - species
      - nickname
      - location
      - substrate
      properties:
        species:
          type: string
        nickname:
          type:
          - string
          - 'null'
        location:
          type: string
        substrate:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SubstratePart'
    PlantDetails:
      title: PlantDetails
      type: object
      required:
      - species
      - nickname
      - location
      - substrate
      - status
      properties:
        species:
          type: string
        nickname:
          type:
          - string
          - 'null'
        location:
          type: string
        substrate:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SubstratePart'
        status:
          $ref: '#/components/schemas/PlantStatus'
    PlantPatchOperation:
      title: PlantPatchOperation
      type: object
      required:
      - op
      - path
      - value
      properties:
        op:
          type: string
        path:
          type: string
        value: {}
    PlantStatus:
      title: PlantStatus
      type: string
      enum:
      - active
      - archived
    Recorded:
      title: Recorded
      type: object
      required:
      - first
      - last
      - kind
      properties:
        first:
          type: string
          format: date-time
        last:
          type: string
          format: date-time
        kind:
          type: string
          const: recorded
    Repot:
      title: Repot
      type: object
      required:
      - substrate
      - notes
      - kind
      properties:
        substrate:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SubstratePart'
        notes:
          type:
          - string
          - 'null'
        kind:
          type: string
          const: repot
    SubstrateComponent:
      title: SubstrateComponent
      type: object
      required:
      - id
      - data
      properties:
        id:
          type: string
          format: uuid
        data:
          $ref: '#/components/schemas/SubstrateComponentData'
    SubstrateComponentData:
      title: SubstrateComponentData
      type: object
      required:
      - name
      - info
      properties:
        name:
          type: string
        info:
          type:
          - string
          - 'null'
    SubstratePart:
      title: SubstratePart
      type: object
      required:
      - componentId
      - share
      properties:
        componentId:
          type: string
          format: uuid
        share:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
    WateringAttention:
      title: WateringAttention
      oneOf:
      - $ref: '#/components/schemas/WateringCurrent'
      - $ref: '#/components/schemas/WateringOverdue'
      - $ref: '#/components/schemas/WateringRedAlert'
      - $ref: '#/components/schemas/WateringUnavailable'
      discriminator:
        propertyName: kind
        mapping:
          current: '#/components/schemas/WateringCurrent'
          overdue: '#/components/schemas/WateringOverdue'
          redAlert: '#/components/schemas/WateringRedAlert'
          unavailable: '#/components/schemas/WateringUnavailable'
    WateringCurrent:
      title: WateringCurrent
      type: object
      required:
      - sampleCount
      - averageIntervalMillis
      - elapsedMillis
      - kind
      properties:
        sampleCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 20
        averageIntervalMillis:
          type: string
        elapsedMillis:
          type: string
        kind:
          type: string
          const: current
    WateringOverdue:
      title: WateringOverdue
      type: object
      required:
      - sampleCount
      - averageIntervalMillis
      - elapsedMillis
      - kind
      properties:
        sampleCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 20
        averageIntervalMillis:
          type: string
        elapsedMillis:
          type: string
        kind:
          type: string
          const: overdue
    WateringRedAlert:
      title: WateringRedAlert
      type: object
      required:
      - sampleCount
      - averageIntervalMillis
      - elapsedMillis
      - kind
      properties:
        sampleCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 20
        averageIntervalMillis:
          type: string
        elapsedMillis:
          type: string
        kind:
          type: string
          const: redAlert
    WateringUnavailable:
      title: WateringUnavailable
      type: object
      required:
      - sampleCount
      - elapsedMillis
      - kind
      properties:
        sampleCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 20
        elapsedMillis:
          type:
          - string
          - 'null'
        kind:
          type: string
          const: unavailable
