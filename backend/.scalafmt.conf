version = "3.8.3"
runner.dialect = scala3
maxColumn = 120
align.preset = more
rewrite.rules = [RedundantBraces, RedundantParens, SortModifiers]
docstrings.style = Asterisk

# Capture-checking syntax (`^`) is not yet parseable by the scalameta version scalafmt uses.
# The single capability wrapper that needs it opts out here; it stays covered by the compiler
# gates (-Werror, capture checking, WartRemover, 100% coverage). See CONTRIBUTING.md.
project.excludePaths = ["glob:**/gardening/capabilities/Database.scala"]
